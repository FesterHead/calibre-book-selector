name: PR Validation

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Packaging
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Python Syntax
        run: python -m py_compile __init__.py action.py config.py dialogs.py selector.py build_plugin.py

      - name: Package Plugin
        run: python build_plugin.py

      - name: Upload PR Plugin Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calibre-book-selector-pr-${{ github.event.pull_request.number || 'manual' }}
          path: calibre-book-selector.zip
          retention-days: 7
